name: ruraltech_app
description: App RuralTech Flutter + Supabase
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  web_socket_channel: ^3.0.1
  http: ^1.2.2
  crypto: ^3.0.6
  supabase_flutter: ^2.8.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.2
  flutter_compass: ^0.8.1
  file_picker: ^8.1.2
  flutter_blue_plus: ^1.35.8
  flutter_svg: ^2.0.17

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/branding/icone.png
    - assets/branding/logotipo.png
  fonts:
    - family: MaterialIcons
      fonts:
        - asset: assets/fonts/MaterialIcons-Regular.otf

flutter_launcher_icons:
  image_path: assets/branding/icone.png
  android: true
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
