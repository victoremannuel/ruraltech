name: Nightly Regression

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

jobs:
  flutter-regression:
    name: Flutter Regression
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze

      - name: Flutter test (full)
        run: flutter test

  supabase-regression:
    name: Supabase Schema + RLS Regression
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local database
        run: supabase db start

      - name: Run pgTAP tests
        run: supabase test db --local

      - name: Stop local database
        if: always()
        run: supabase stop --no-backup

  backend-functions-regression:
    name: Supabase Functions Regression
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Typecheck edge functions
        run: |
          deno check supabase/functions/_shared/supabase.ts
          deno check supabase/functions/queue-lora-command/index.ts
          deno check supabase/functions/admin-repair-cloud-state/index.ts
          deno check supabase/functions/matrix-cloud/index.ts
          deno check supabase/functions/send-push/index.ts
          deno check supabase/functions/poll-notifications/index.ts

  firmware-contract-regression:
    name: Firmware Contract Regression
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run firmware host-side tests
        run: |
          g++ -std=c++17 -Wall -Wextra -pedantic \
            firmware/shared/command_contract.cpp \
            firmware/tests/command_contract_test.cpp \
            -o /tmp/command_contract_test
          /tmp/command_contract_test
          g++ -std=c++17 -Wall -Wextra -pedantic \
            gateway-matriz/QueueStreamSupport.cpp \
            firmware/tests/queue_stream_support_test.cpp \
            -o /tmp/queue_stream_support_test
          /tmp/queue_stream_support_test

  firmware-regression:
    name: Firmware Regression Compile
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - sketch: coleira
            path: coleira
          - sketch: gateway
            path: gateway
          - sketch: gateway-matriz
            path: gateway-matriz
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup arduino-cli
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core
        run: |
          arduino-cli config init --overwrite
          arduino-cli core update-index --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core install esp32:esp32 --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json

      - name: Install libs
        run: |
          arduino-cli lib install "ArduinoJson@7.4.2"
          arduino-cli lib install "RadioLib@6.6.0"
          arduino-cli lib install "WebSockets@2.7.2"
          arduino-cli lib install "RTClib@2.1.4"
          arduino-cli lib install "Adafruit SSD1306@2.5.15"
          arduino-cli lib install "Adafruit GFX Library@1.12.1"
          arduino-cli lib install "TinyGPSPlus@1.0.3"
          arduino-cli lib install "Adafruit MLX90614 Library@2.1.5"
          arduino-cli lib install "MPU6050_tockn@1.5.2"

      - name: Compile ${{ matrix.sketch }}
        run: >
          arduino-cli compile
          --fqbn esp32:esp32:esp32:PartitionScheme=min_spiffs
          ${{ matrix.path }}
